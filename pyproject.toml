[project]
name = "kaladrius"
version = "0.31.0"
description = "Clinic management system"
requires-python = ">=3.13"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert is allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]  # hard-coded passwords and SQL text in tests

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/wsgi.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
