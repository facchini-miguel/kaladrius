{% load i18n formats %}<div class="col-lg-6">
  <h2 class="h6">{{ titulo }}</h2>
  <table class="table table-sm bg-white">
    <tbody>
      {% for name, value in linhas %}
      <tr>
        <td>{{ name|default:_("Sem profissional") }}</td>
        <td class="text-end text-nowrap">{{ value|currency }}</td>
        <td class="text-end text-body-secondary small" style="width: 4rem;">{% widthratio value total 100 %}%</td>
      </tr>
      {% empty %}
      <tr><td class="text-body-secondary">{% translate "Nada no período." %}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
