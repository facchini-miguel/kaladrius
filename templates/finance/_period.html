{% load i18n %}<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-6 col-md-3">
    <label class="form-label small" for="since">{% translate "De" %}</label>
    <input type="date" id="since" name="since" value="{{ since|date:'Y-m-d' }}" class="form-control">
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label small" for="until">{% translate "Até" %}</label>
    <input type="date" id="until" name="until" value="{{ until|date:'Y-m-d' }}" class="form-control">
  </div>
  {% if group %}
  <div class="col-6 col-md-3">
    <label class="form-label small" for="group">{% translate "Agrupar por" %}</label>
    <select id="group" name="group" class="form-select">
      <option value="dia"{% if not by_month %} selected{% endif %}>{% translate "Dia" %}</option>
      <option value="mes"{% if by_month %} selected{% endif %}>{% translate "Mês" %}</option>
    </select>
  </div>
  {% endif %}
  <div class="col-6 col-md-3"><button type="submit" class="btn btn-primary w-100">{% translate "Ver" %}</button></div>
</form>
