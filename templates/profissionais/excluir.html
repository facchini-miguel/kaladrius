{% extends "base.html" %}

{% block titulo %}Excluir profissional · Medical System{% endblock %}

{% block conteudo %}
<h1 class="h3 mb-3">Excluir {{ profissional.nome }}?</h1>
<p>Esta ação não pode ser desfeita. Se quiser apenas esconder o profissional, edite e desmarque “ativo”.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Excluir</button>
  <a class="btn btn-link" href="{% url 'profissionais:lista' %}">Cancelar</a>
</form>
{% endblock %}
