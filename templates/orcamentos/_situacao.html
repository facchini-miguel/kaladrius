{% load i18n %}{% if orcamento.situacao == "aprovado" %}<span class="badge text-bg-success">{{ orcamento.get_situacao_display }}</span>{% elif orcamento.situacao == "recusado" %}<span class="badge text-bg-secondary">{{ orcamento.get_situacao_display }}</span>{% elif orcamento.vencido %}<span class="badge text-bg-warning">{% translate "Vencido" %}</span>{% else %}<span class="badge text-bg-primary">{{ orcamento.get_situacao_display }}</span>{% endif %}
