{% extends "base.html" %}
{% load i18n %}

{% block titulo %}{% translate "Trocar senha" %} · {{ nome_sistema }}{% endblock %}

{% block conteudo %}
<h1 class="h3 mb-4">{% translate "Trocar senha" %}</h1>

<form method="post" style="max-width: 28rem;" novalidate>
  {% csrf_token %}
  {% include "includes/formulario.html" %}
  <button type="submit" class="btn btn-primary">{% translate "Salvar" %}</button>
  <a class="btn btn-link" href="{% url 'inicio' %}">{% translate "Cancelar" %}</a>
</form>
{% endblock %}
