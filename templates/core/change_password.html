{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Change password" %} · {{ system_name }}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{% translate "Change password" %}</h1>

<form method="post" style="max-width: 28rem;" novalidate>
  {% csrf_token %}
  {% include "includes/form.html" %}
  <button type="submit" class="btn btn-primary">{% translate "Save" %}</button>
  <a class="btn btn-link" href="{% url 'home' %}">{% translate "Cancel" %}</a>
</form>
{% endblock %}
