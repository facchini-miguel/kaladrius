{% extends "base.html" %}

{% block titulo %}Excluir rechamada · Medical System{% endblock %}

{% block conteudo %}
<h1 class="h3 mb-3">Excluir a rechamada de {{ rechamada.paciente.nome }} ({{ rechamada.data|date:"d/m/Y" }})?</h1>
<p>Esta ação não pode ser desfeita.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Excluir</button>
  <a class="btn btn-link" href="{% url 'rechamadas:lista' %}">Cancelar</a>
</form>
{% endblock %}
