{% load formats i18n %}{% for patient in patients %}
<a href="#" class="list-group-item list-group-item-action" data-patient-id="{{ patient.pk }}" data-patient-name="{{ patient.name }}">
  {{ patient.name }} <small class="text-body-secondary">· {% translate "code" %} {{ patient.pk }}{% if patient.tax_id %} · {{ patient.tax_id|document:patient.document_role }}{% endif %}</small>
</a>
{% endfor %}
