{% load i18n %}<li class="list-group-item d-flex justify-content-between align-items-center gap-2">
  <span>
    <a href="{% url 'schedule:calendar' %}?practitioner={{ agendamento.practitioner_id }}&amp;date={{ agendamento.inicio|date:'Y-m-d' }}">{{ agendamento.inicio|date:"SHORT_DATETIME_FORMAT" }}</a>
    · {{ agendamento.practitioner.name }}
  </span>
  <span class="legenda-tipo small" style="background-color: {{ agendamento.kind.cor }}">{{ agendamento.kind.nome_exibido }}</span>
</li>
