<div class="modal-header">
  <h2 class="modal-title h5">Aniversariantes de {{ dia|date:"d/m" }}</h2>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
</div>
<div class="modal-body">
  <ul class="list-group">
    {% for paciente, idade in aniversariantes %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{% url 'pacientes:ficha' paciente.pk %}">{{ paciente.nome }}</a>
      <span class="text-body-secondary">completa {{ idade }} ano{{ idade|pluralize }}</span>
    </li>
    {% empty %}
    <li class="list-group-item text-body-secondary">Nenhum aniversariante neste dia.</li>
    {% endfor %}
  </ul>
</div>
