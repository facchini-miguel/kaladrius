{% extends "base.html" %}

{% block titulo %}Excluir paciente · Medical System{% endblock %}

{% block conteudo %}
<h1 class="h3 mb-3">Excluir {{ paciente.nome }}?</h1>
<p>Esta ação não pode ser desfeita. Se quiser apenas esconder o paciente, edite e desmarque “ativo”.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Excluir</button>
  <a class="btn btn-link" href="{% url 'pacientes:ficha' paciente.pk %}">Cancelar</a>
</form>
{% endblock %}
