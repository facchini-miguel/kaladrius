{% load i18n %}{% if estimate.status == "approved" %}<span class="badge text-bg-success">{{ estimate.get_status_display }}</span>{% elif estimate.status == "refused" %}<span class="badge text-bg-secondary">{{ estimate.get_status_display }}</span>{% elif estimate.is_expired %}<span class="badge text-bg-warning">{% translate "Overdue" %}</span>{% else %}<span class="badge text-bg-primary">{{ estimate.get_status_display }}</span>{% endif %}
