{% load i18n %}{% if orcamento.status == "aprovado" %}<span class="badge text-bg-success">{{ orcamento.get_status_display }}</span>{% elif orcamento.status == "recusado" %}<span class="badge text-bg-secondary">{{ orcamento.get_status_display }}</span>{% elif orcamento.vencido %}<span class="badge text-bg-warning">{% translate "Vencido" %}</span>{% else %}<span class="badge text-bg-primary">{{ orcamento.get_status_display }}</span>{% endif %}
