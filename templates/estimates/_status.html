{% load i18n %}{% if estimate.status == "aprovado" %}<span class="badge text-bg-success">{{ estimate.get_status_display }}</span>{% elif estimate.status == "recusado" %}<span class="badge text-bg-secondary">{{ estimate.get_status_display }}</span>{% elif estimate.vencido %}<span class="badge text-bg-warning">{% translate "Vencido" %}</span>{% else %}<span class="badge text-bg-primary">{{ estimate.get_status_display }}</span>{% endif %}
