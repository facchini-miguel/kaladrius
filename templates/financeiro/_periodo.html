{% load i18n %}<form method="get" class="row g-2 align-items-end mb-3">
  <div class="col-6 col-md-3">
    <label class="form-label small" for="de">{% translate "De" %}</label>
    <input type="date" id="de" name="de" value="{{ de|date:'Y-m-d' }}" class="form-control">
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label small" for="ate">{% translate "Até" %}</label>
    <input type="date" id="ate" name="ate" value="{{ ate|date:'Y-m-d' }}" class="form-control">
  </div>
  {% if agrupar %}
  <div class="col-6 col-md-3">
    <label class="form-label small" for="agrupar">{% translate "Agrupar por" %}</label>
    <select id="agrupar" name="agrupar" class="form-select">
      <option value="dia"{% if not por_mes %} selected{% endif %}>{% translate "Dia" %}</option>
      <option value="mes"{% if por_mes %} selected{% endif %}>{% translate "Mês" %}</option>
    </select>
  </div>
  {% endif %}
  <div class="col-6 col-md-3"><button type="submit" class="btn btn-primary w-100">{% translate "Ver" %}</button></div>
</form>
