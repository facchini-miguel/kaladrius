{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "New password" %} · {{ system_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5"><div class="col-sm-9 col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">{% translate "Password saved" %}</h1>
    <p>{% translate "Now log in with the new password." %}</p>
    <a class="btn btn-primary w-100" href="{% url 'login' %}">{% translate "Log in" %}</a>
  </div></div>
</div></div>
{% endblock %}
