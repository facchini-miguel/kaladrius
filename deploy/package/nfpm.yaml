# Linux packages of Kaladrius (decision 140), built by deploy/package/build.sh with nFPM
# (https://nfpm.goreleaser.com) from the repository's root: one .deb (Debian 13+, Ubuntu
# 24.04+), one .rpm (Fedora, RHEL, Rocky Linux, AlmaLinux, openSUSE) and one .pkg.tar.zst
# (Arch Linux, CachyOS) of shell scripts and
# configuration. The system itself is the public image of the same version, pinned by digest
# in release/linux-package; amd64 only, like the image.
name: kaladrius
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: misc
priority: optional
maintainer: Miguel Facchini <facchini-miguel@users.noreply.github.com>
vendor: Miguel Facchini
homepage: https://github.com/facchini-miguel/kaladrius
license: Apache-2.0
description: |-
  Clinic management system (Kaladrius)
  Patients, schedule, medical records, budgets, finances and the clinic's team, in a web app
  for the clinic's internal network or the internet. Runs in Docker containers (PostgreSQL,
  Caddy with HTTPS), with daily backups, a weekly restore test and automatic rollback of a
  failed update. After installing: sudo kaladrius configure

contents:
  - src: deploy/package/kaladrius
    dst: /opt/kaladrius/bin/kaladrius
    file_info: {mode: 0755}
  - src: /opt/kaladrius/bin/kaladrius
    dst: /usr/bin/kaladrius
    type: symlink
  - src: deploy/server/common.sh
    dst: /opt/kaladrius/bin/common.sh
    file_info: {mode: 0644}
  - src: deploy/server/update.sh
    dst: /opt/kaladrius/bin/update.sh
    file_info: {mode: 0755}
  - src: deploy/server/backup.sh
    dst: /opt/kaladrius/bin/backup.sh
    file_info: {mode: 0755}
  - src: deploy/server/health.sh
    dst: /opt/kaladrius/bin/health.sh
    file_info: {mode: 0755}
  - src: deploy/server/test_restore.sh
    dst: /opt/kaladrius/bin/test_restore.sh
    file_info: {mode: 0755}
  - src: deploy/docker-compose.prod.yml
    dst: /opt/kaladrius/release/docker-compose.prod.yml
    file_info: {mode: 0644}
  - src: deploy/Caddyfile
    dst: /opt/kaladrius/release/Caddyfile
    file_info: {mode: 0644}
  # VERSION and IMAGE (with its digest), written by build.sh.
  - src: dist/linux-package
    dst: /opt/kaladrius/release/linux-package
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-backup.service
    dst: /usr/lib/systemd/system/kaladrius-backup.service
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-backup.timer
    dst: /usr/lib/systemd/system/kaladrius-backup.timer
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-health.service
    dst: /usr/lib/systemd/system/kaladrius-health.service
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-health.timer
    dst: /usr/lib/systemd/system/kaladrius-health.timer
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-restore-test.service
    dst: /usr/lib/systemd/system/kaladrius-restore-test.service
    file_info: {mode: 0644}
  - src: deploy/server/kaladrius-restore-test.timer
    dst: /usr/lib/systemd/system/kaladrius-restore-test.timer
    file_info: {mode: 0644}
  # The package repository's apt source and .repo file (decision 142), which
  # post_install.sh copies when the repository is not configured yet.
  - src: deploy/package/repository/kaladrius.sources
    dst: /opt/kaladrius/repository/kaladrius.sources
    file_info: {mode: 0644}
    packager: deb
  - src: deploy/package/repository/kaladrius.repo
    dst: /opt/kaladrius/repository/kaladrius.repo
    file_info: {mode: 0644}
    packager: rpm
  - src: LICENSE
    dst: /usr/share/doc/kaladrius/copyright
    file_info: {mode: 0644}
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/kaladrius/LICENSE
    file_info: {mode: 0644}
    packager: rpm

scripts:
  postinstall: deploy/package/post_install.sh
  preremove: deploy/package/pre_remove.sh
  postremove: deploy/package/post_remove.sh

# pacman runs post_upgrade, not post_install, on an update: the same script (it updates the
# system when there is a .env).
archlinux:
  scripts:
    postupgrade: deploy/package/post_install.sh

recommends:
  - whiptail

overrides:
  deb:
    depends:
      - docker.io (>= 24) | docker-ce
      - docker-compose (>= 2) | docker-compose-v2 | docker-compose-plugin
      - curl
      - iproute2
  rpm:
    depends:
      - (moby-engine or docker-ce or docker)
      - (docker-compose or docker-compose-plugin)
      - curl
      - iproute
    recommends:
      - newt
  archlinux:
    depends:
      - docker
      - docker-compose
      - curl
      - iproute2
    recommends:
      - libnewt  # whiptail (an optional dependency on Arch Linux)
