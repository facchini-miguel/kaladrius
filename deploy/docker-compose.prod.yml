# Production stack on the Compute Engine VM. Managed by deploy/servidor/atualizar.sh.
# ${VAR} values come from /opt/medical-system/.env (linked as .env next to this file).
# Only the app receives the whole file; the other services get just what they need.
name: medical-system

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # Sized for the e2-micro (1 GB RAM).
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGEM_APP:-us-east1-docker.pkg.dev/medical-system-facchini/medical-system/app:latest}
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from the VM itself (Caddy); never published to the internet.
    ports:
      - "127.0.0.1:8000:8000"
    # Server health samples written by deploy/servidor/saude.sh (read-only for the app).
    volumes:
      - ../saude:/saude:ro

  # Documentation site (website/, decision 067). Optional: runs only with COMPOSE_PROFILES=docs
  # and DOCS_HOSTNAME in .env.
  docs:
    image: ${IMAGEM_DOCS:-us-east1-docker.pkg.dev/medical-system-facchini/medical-system/docs:latest}
    profiles: [docs]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?}
      DOCS_HOSTNAME: ${DOCS_HOSTNAME:-}
    # Host network: listens on the VM's public IPv6 and sees the real client IP.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
