# Production stack on the Compute Engine VM. Managed by deploy/server/update.sh.
# ${VAR} values come from /opt/kaladrius/.env (linked as .env next to this file).
# Only the app receives the whole file; the other services get just what they need.
name: kaladrius

services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # Sized for the e2-micro (1 GB RAM).
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # IMAGEM_APP and IMAGEM_DOCS: the names before decision 147, still read.
    image: ${APP_IMAGE:-${IMAGEM_APP:-us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/app:latest}}
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from the VM itself (Caddy); never published to the internet.
    ports:
      - "127.0.0.1:8000:8000"
    # Server health samples written by deploy/server/health.sh (read-only for the app).
    volumes:
      - ../health:/health:ro

  # Documentation site (docs/, decisions 067 and 073). Optional: runs only with COMPOSE_PROFILES=docs
  # and DOCS_HOSTNAME in .env.
  docs:
    image: ${DOCS_IMAGE:-${IMAGEM_DOCS:-us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/docs:latest}}
    profiles: [docs]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?}
      # Never empty: an empty address would make the Caddyfile's docs block invalid and Caddy
      # would not start (an installation without the documentation site, decision 140).
      DOCS_HOSTNAME: ${DOCS_HOSTNAME:-docs.localhost}
    # Host network: listens on the VM's public IPv6 and sees the real client IP.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
