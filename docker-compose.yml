# Local development environment.
# Usage: docker compose up --build   →   http://localhost:8000
# Fixed name (the folder name has a space), different from production's "medical-system"
# so the two stacks never share containers or volumes on the same machine.
name: medical-system-dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports": the database is only reachable on the internal Docker network.

  app:
    build:
      context: .
      args:
        DEV: "1"
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    # In development, use Django's server, which reloads when files are saved.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  # Documentation site (website/), only when asked for:
  # docker compose --profile docs up --build docs   →   http://localhost:3000
  docs:
    build:
      context: .
      dockerfile: website/Dockerfile
    profiles: [docs]
    ports:
      - "127.0.0.1:3000:80"

volumes:
  pgdata:
