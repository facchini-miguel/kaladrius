          cada transacción con los pagos y cobros ya registrados (de una vez, cuando hay uno
          solo posible), cree el registro de lo que faltaba, como tasas, o ignórelo con un
          motivo. El saldo del banco se compara con el del sistema.

- versao: 0.19.0
