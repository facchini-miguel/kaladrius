# Kaladrius version history.
# Single source for the "Novidades" (What's new) web page, the app API and the footer.
# Format and rules: docs/docs/project/versioning.md
# The newest entry always goes at the top.
# Texts are shown to users: "titulo" and "texto" have one text per language (pt-br, en, es).

- versao: 0.32.0
  data: 2026-10-29
  titulo:
    pt-br: Contas de demonstração
    en: Demo accounts
    es: Cuentas de demostración
  itens:
    - tipo: novo
      modulo: Equipe
      publico: [equipe]
      texto:
        pt-br: >
          A demonstração tem contas públicas de recepção e de profissional, com a senha
          publicada no site. Elas não trocam a senha nem enviam anexos, para que ninguém tranque
          os outros visitantes nem use o servidor para guardar arquivos.
        en: >
          The demo has public front desk and practitioner logins, with the password published
          on the website. They cannot change the password nor upload attachments, so nobody
          locks the other visitors out or uses the server to store files.
        es: >
          La demostración tiene cuentas públicas de recepción y de profesional, con la
          contraseña publicada en el sitio. No cambian la contraseña ni envían adjuntos, para
          que nadie deje afuera a los otros visitantes ni use el servidor para guardar archivos.

- versao: 0.31.0
  data: 2026-10-28
  titulo:
    pt-br: Pedido de exames e anexos no prontuário
    en: Exam requests and attachments in the medical record
    es: Solicitud de exámenes y adjuntos en la historia clínica
  itens:
    - tipo: novo
      modulo: Pacientes
      publico: [equipe]
      texto:
        pt-br: >
          No atendimento, quem atendeu emite o pedido de exames, impresso como o atestado e a
          receita. E qualquer profissional anexa arquivos (resultados de exames, fotos, laudos)
          em PDF, JPG ou PNG de até 10 MB, que ficam guardados no prontuário.
        en: >
          In a visit, its author issues exam requests, printed like certificates and
          prescriptions. And any practitioner attaches files (exam results, photos, reports) as
          PDF, JPG or PNG up to 10 MB, kept in the medical record.
        es: >
          En la consulta, quien atendió emite la solicitud de exámenes, impresa como el
          certificado y la receta. Y cualquier profesional adjunta archivos (resultados de
          exámenes, fotos, informes) en PDF, JPG o PNG de hasta 10 MB, que quedan guardados en
          la historia clínica.

- versao: 0.30.0
  data: 2026-10-28
  titulo:
    pt-br: Impressão do prontuário, atestados e receitas
    en: Medical record printing, certificates and prescriptions
    es: Impresión de la historia clínica, certificados y recetas
  itens:
    - tipo: novo
      modulo: Pacientes
      publico: [equipe]
      texto:
        pt-br: >
          O atendimento finalizado pode ser impresso ou salvo em PDF, com o cabeçalho da
          clínica e a linha de assinatura. Quem fez o atendimento emite atestados (de
          comparecimento ou de afastamento) e receitas simples, que ficam guardados no
          prontuário e podem ser impressos de novo.
        en: >
          A finalized visit can be printed or saved as PDF, with the clinic's header and a
          signature line. The visit's author issues certificates (of attendance or of leave)
          and simple prescriptions, which are kept in the medical record and can be printed
          again.
        es: >
          La consulta finalizada puede imprimirse o guardarse en PDF, con el encabezado de la
          clínica y la línea de firma. Quien hizo la consulta emite certificados (de asistencia
          o de reposo) y recetas simples, que quedan guardados en la historia clínica y pueden
          imprimirse de nuevo.

- versao: 0.29.0
  data: 2026-10-28
  titulo:
    pt-br: Prontuário
    en: Medical record
    es: Historia clínica
  itens:
    - tipo: novo
      modulo: Pacientes
      publico: [equipe]
      texto:
        pt-br: >
          Os profissionais registram a anamnese de cada atendimento (queixa principal, história
          da doença atual, antecedentes, exame físico e conduta), pela agenda ou pela ficha do
          paciente. Depois de finalizado, o atendimento não muda mais, e correções viram
          adendos. Só os profissionais veem o prontuário, que é guardado por 20 anos.
        en: >
          Practitioners record the anamnesis of each visit (chief complaint, history of present
          illness, history, physical examination and plan), from the schedule or the patient
          record. Once finalized, a visit no longer changes, and corrections become addenda.
          Only practitioners see the medical record, which is kept for 20 years.
        es: >
          Los profesionales registran la anamnesis de cada consulta (motivo de consulta,
          enfermedad actual, antecedentes, examen físico y conducta), desde la agenda o la ficha
          del paciente. Una vez finalizada, la consulta ya no cambia, y las correcciones se
          vuelven adendas. Solo los profesionales ven la historia clínica, que se guarda por 20
          años.

- versao: 0.28.0
  data: 2026-10-28
  titulo:
    pt-br: Área da clínica (Odontologia, Medicina e outras)
    en: Clinic area (Dentistry, Medicine and others)
    es: Área de la clínica (Odontología, Medicina y otras)
  itens:
    - tipo: novo
      modulo: Geral
      publico: [equipe]
      texto:
        pt-br: >
          Em Configurações da clínica, escolha a área: Odontologia, Medicina ou outra área da
          saúde. O odontograma e os dentes e faces dos orçamentos aparecem só na Odontologia; nas
          outras áreas, o orçamento fica com procedimento, descrição, quantidade e valor. Trocar
          a área não apaga nada.
        en: >
          In Clinic settings, choose the area: Dentistry, Medicine or another health area. The
          dental chart and the teeth and surfaces of estimates only appear in Dentistry; in the
          other areas, an estimate has the procedure, description, quantity and price. Changing
          the area deletes nothing.
        es: >
          En Configuración de la clínica, elija el área: Odontología, Medicina u otra área de la
          salud. El odontograma y los dientes y caras de los presupuestos aparecen solo en
          Odontología; en las otras áreas, el presupuesto tiene procedimiento, descripción,
          cantidad y valor. Cambiar el área no borra nada.

- versao: 0.27.2
  data: 2026-10-28
  titulo:
    pt-br: Arquivar paciente só com as contas resolvidas
    en: Archive a patient only with their entries settled
    es: Archivar al paciente solo con las cuentas resueltas
  itens:
    - tipo: melhoria
      modulo: Pacientes
      publico: [equipe]
      texto:
        pt-br: >
          Um paciente com contas em aberto no financeiro só pode ser arquivado depois que elas
          forem recebidas ou canceladas. A tela Arquivar mostra essas contas, com link para
          cada uma.
        en: >
          A patient with open entries in Finance can only be archived after they are received or
          cancelled. The Archive page lists those entries, with a link to each one.
        es: >
          Un paciente con cuentas pendientes en Finanzas solo puede archivarse después de que se
          cobren o anulen. La pantalla Archivar muestra esas cuentas, con un enlace a cada una.

- versao: 0.27.1
  data: 2026-10-28
  titulo:
    pt-br: Desconto no orçamento para toda a equipe
    en: Estimate discount for the whole team
    es: Descuento en el presupuesto para todo el equipo
  itens:
    - tipo: melhoria
      modulo: Orçamentos
      publico: [equipe]
      texto:
        pt-br: >
          Quem escreve o orçamento (recepção, profissional ou administrador) agora também pode
          dar desconto no total. Antes, só o administrador podia.
        en: >
          Whoever writes the estimate (front desk, practitioner or administrator) can now also
