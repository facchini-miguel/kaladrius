# Medical System version history.
# Single source for the "Novidades" (What's new) web page, the app API and the footer.
# Format and rules: docs/en/versioning-and-releases.md
# The newest entry always goes at the top.
# Release note texts stay in Portuguese: they are shown to users.

- versao: 0.1.0
  data: 2026-10-26
  titulo: Primeira versão do novo sistema
  itens:
    - tipo: novo
      modulo: Acesso
      publico: [equipe]
      texto: >
        Entrada no sistema com usuário e senha. As senhas são guardadas com criptografia
        moderna e a sessão expira após 8 horas ou ao fechar o navegador.
    - tipo: novo
      modulo: Novidades
      publico: [equipe, paciente]
      texto: >
        Página de Novidades com o que mudou em cada versão. A versão atual aparece no
        rodapé; clique nela para ver os detalhes.
    - tipo: novo
      modulo: Documentação
      publico: []
      texto: >
        Estrutura do projeto, Docker, documentação, decisões de arquitetura e plano da fase 1.
