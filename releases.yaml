          and the last backup. A warning shows at the top of every screen if a resource
          reaches its limit.
        es: >
          Para superusuarios, en Administración > Salud del sistema: procesador, memoria, swap,
          disco, red y contenedores del servidor, con gráficos de 24 horas y 7 días, el tamaño
          de la base y la última copia de seguridad. Un aviso aparece arriba de las pantallas
          si algún recurso llega al límite.

