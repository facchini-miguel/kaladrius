- versao: 0.20.0
  data: 2026-10-27
  titulo:
    pt-br: Importação do extrato bancário
    en: Bank statement import
    es: Importación del extracto bancario
  itens:
    - tipo: novo
      modulo: Financeiro
      publico: [equipe]
      texto:
        pt-br: >
          Novo em Financeiro > Extrato bancário: importe o extrato OFX do banco e concilie cada
          transação com os pagamentos e recebimentos já lançados (de uma vez, quando só há um
          possível), crie o lançamento do que faltava, como tarifas, ou ignore com um motivo. O
          saldo do banco é comparado com o do sistema.
        en: >
          New in Finance > Bank statement: import the bank's OFX statement and reconcile each
          transaction with the payments and receipts already recorded (all at once, when there
