name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_system
          POSTGRES_USER: medical_system
          POSTGRES_PASSWORD: ci-somente
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medical_system"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-somente-nao-usar-em-producao
      DJANGO_DEBUG: "0"
      POSTGRES_DB: medical_system
      POSTGRES_USER: medical_system
      POSTGRES_PASSWORD: ci-somente
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Verificações do Django
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py collectstatic --noinput && pytest
