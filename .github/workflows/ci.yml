name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_system
          POSTGRES_USER: medical_system
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medical_system"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      DJANGO_DEBUG: "0"
      POSTGRES_DB: medical_system
      POSTGRES_USER: medical_system
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: GNU gettext (compiles the translations)
        run: sudo apt-get install -y --no-install-recommends gettext
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Translations up to date (every text marked and extracted)
        run: |
          python manage.py makemessages -l en -l es --no-location --ignore=staticfiles --ignore=tests
          git diff --exit-code -I 'POT-Creation-Date' locale/
      - name: Tests
        run: python manage.py compilemessages && python manage.py collectstatic --noinput && pytest --cov --cov-report=term-missing

  # Publishes the image to Google Artifact Registry; the VM picks it up within 5 minutes.
  publicar:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # keyless login to Google Cloud (Workload Identity Federation)
    env:
      IMAGEM: us-east1-docker.pkg.dev/medical-system-facchini/medical-system/app
    steps:
      - uses: actions/checkout@v5
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/16678297522/locations/global/workloadIdentityPools/github/providers/medical-system
          service_account: github-ci@medical-system-facchini.iam.gserviceaccount.com
          token_format: access_token
      - name: Login no Artifact Registry
        run: echo "${{ steps.google.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
      - name: Build e publicação da imagem
        run: |
          VERSAO=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAGS=(-t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::12}")
          # The version tag points to the first image of that version and is never moved.
          if ! docker manifest inspect "$IMAGEM:$VERSAO" >/dev/null 2>&1; then
            TAGS+=(-t "$IMAGEM:$VERSAO")
          fi
          docker build "${TAGS[@]}" .
          docker push --all-tags "$IMAGEM"
