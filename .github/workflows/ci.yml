name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag in the comment): a moved tag cannot
# change what runs with the deploy credentials. Update both together.
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      DJANGO_DEBUG: "0"
      POSTGRES_DB: kaladrius
      POSTGRES_USER: kaladrius
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step uses git credentials (decision 132)
      # The PostgreSQL of production, image and digest read from deploy/docker-compose.prod.yml
      # (decision 138; the same script as migracoes.yml). Started first and waited for before
      # the Django checks, so it comes up while the rest is installed.
      - name: PostgreSQL (the production image)
        run: .github/postgres.sh iniciar
      - name: Locks up to date (every .in compiled, both locks agree, decision 136)
        run: deploy/gerar_lock.sh --verificar
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: GNU gettext (compiles the translations)
        run: sudo apt-get install -y --no-install-recommends gettext
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: PostgreSQL ready
        run: .github/postgres.sh esperar
      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Translations up to date (every text marked and extracted)
        run: |
          python manage.py makemessages -l en -l es --no-location --ignore=staticfiles --ignore=tests --ignore=docs
          git diff --exit-code -I 'POT-Creation-Date' locale/
      - name: Tests
        run: python manage.py compilemessages && python manage.py collectstatic --noinput && pytest --cov --cov-report=term-missing

  # Documentation site (docs/, decisions 067 and 073): built on every push and pull request (broken
  # links fail the build); on main, published next to the app image.
  documentacao:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # keyless login to Google Cloud (Workload Identity Federation)
    env:
      IMAGEM: us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step uses git credentials (decision 132)
      - name: Build do site
        run: docker build -t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::12}" docs
      - id: google
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/16678297522/locations/global/workloadIdentityPools/github/providers/kaladrius
          service_account: github-ci@medical-system-facchini.iam.gserviceaccount.com
          token_format: access_token
      - name: Publicação da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ steps.google.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
          docker push --all-tags "$IMAGEM"

  # Linux packages (decision 140): built on every push and pull request, and installed in clean
  # Debian, Ubuntu, Fedora, openSUSE and Arch Linux containers. The release job builds them again with the
  # published image's digest and attaches them to the release.
  pacote-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step uses git credentials (decision 132)
      - name: Pacotes .deb, .rpm e .pkg.tar.zst
        run: deploy/pacote/gerar.sh --imagem ghcr.io/facchini-miguel/kaladrius:latest
      - name: Instalação no Debian, Ubuntu, Fedora, openSUSE e Arch Linux
        run: deploy/pacote/testar_instalacao.sh

  # Publishes the image to Google Artifact Registry (the VM picks it up within 5 minutes) and
  # to GitHub Packages, ghcr.io, for anyone installing Kaladrius (decision 076).
  # After the docs image, so the VM never starts a stack whose docs image is missing.
  publicar:
    needs: [tests, documentacao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # keyless login to Google Cloud (Workload Identity Federation)
      packages: write  # ghcr.io/facchini-miguel/kaladrius
    env:
      IMAGEM: us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/app
      IMAGEM_PUBLICA: ghcr.io/facchini-miguel/kaladrius
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step uses git credentials (decision 132)
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/16678297522/locations/global/workloadIdentityPools/github/providers/kaladrius
          service_account: github-ci@medical-system-facchini.iam.gserviceaccount.com
          token_format: access_token
      - name: Login no Artifact Registry
        run: echo "${{ steps.google.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
      - name: Login no GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Build e publicação da imagem
        run: |
          VERSAO=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAGS=()
          for destino in "$IMAGEM" "$IMAGEM_PUBLICA"; do
            TAGS+=(-t "$destino:latest" -t "$destino:${GITHUB_SHA::12}")
            # The version tag points to the first image of that version and is never moved.
            if ! docker manifest inspect "$destino:$VERSAO" >/dev/null 2>&1; then
              TAGS+=(-t "$destino:$VERSAO")
            fi
          done
          docker build "${TAGS[@]}" .
          docker push --all-tags "$IMAGEM"
          docker push --all-tags "$IMAGEM_PUBLICA"

  # GitHub Release of each new version (decision 119): after the image is published, the version
  # of pyproject.toml (the top of releases.yaml, the tests check they match) gets its tag vX.Y.Z
  # and its release in English, from notas_release, when they do not exist yet. Nobody has to
  # remember. With a SITE_TOKEN secret (a fine-grained token with Actions: write on
  # facchini-miguel/facchini.eti.br), the owner's site is rebuilt right away to show it;
  # without one, the site's hourly build picks it up.
  release:
    needs: [publicar, pacote-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # tag and release
    env:
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      DJANGO_DEBUG: "0"
      # Only whether the secret exists, so tokens reach just the steps that use them, never
      # "pip install", which runs third-party code (decision 132).
      TEM_SITE_TOKEN: ${{ secrets.SITE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no step uses git credentials (decision 132)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: GNU gettext (the notes name the types and modules in English)
        run: sudo apt-get install -y --no-install-recommends gettext
      - name: Release da versão nova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSAO=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            echo "v$VERSAO já está publicada."
            exit 0
          fi
          python manage.py compilemessages >/dev/null
          python manage.py notas_release "$VERSAO" --titulo > titulo.txt
          python manage.py notas_release "$VERSAO" > notas.md
          # The Linux packages of the version (decision 140), with the image just published,
          # pinned by its digest; refused when the version's image came from another commit.
          deploy/pacote/gerar.sh --commit "$GITHUB_SHA"
          gh release create "v$VERSAO" --target "$GITHUB_SHA" --title "$(cat titulo.txt)" \
            --notes-file notas.md --latest \
            "dist/kaladrius_${VERSAO}-1_amd64.deb" "dist/kaladrius-${VERSAO}-1.x86_64.rpm" \
            "dist/kaladrius-${VERSAO}-1-x86_64.pkg.tar.zst" dist/SHA256SUMS
          echo "SITE_DESATUALIZADO=1" >> "$GITHUB_ENV"
      - name: Atualizar o site do titular
        if: env.SITE_DESATUALIZADO == '1' && env.TEM_SITE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: gh workflow run publicar.yml -R facchini-miguel/facchini.eti.br
