name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag in the comment): a moved tag cannot
# change what runs with the deploy credentials. Update both together.
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaladrius
          POSTGRES_USER: kaladrius
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaladrius"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-never-use-in-production
      DJANGO_DEBUG: "0"
      POSTGRES_DB: kaladrius
      POSTGRES_USER: kaladrius
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: GNU gettext (compiles the translations)
        run: sudo apt-get install -y --no-install-recommends gettext
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Django checks
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Translations up to date (every text marked and extracted)
        run: |
          python manage.py makemessages -l en -l es --no-location --ignore=staticfiles --ignore=tests --ignore=docs
          git diff --exit-code -I 'POT-Creation-Date' locale/
      - name: Tests
        run: python manage.py compilemessages && python manage.py collectstatic --noinput && pytest --cov --cov-report=term-missing

  # Documentation site (docs/, decisions 067 and 073): built on every push and pull request (broken
  # links fail the build); on main, published next to the app image.
  documentacao:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # keyless login to Google Cloud (Workload Identity Federation)
    env:
      IMAGEM: us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/docs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Build do site
        run: docker build -t "$IMAGEM:latest" -t "$IMAGEM:${GITHUB_SHA::12}" docs
      - id: google
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/16678297522/locations/global/workloadIdentityPools/github/providers/kaladrius
          service_account: github-ci@medical-system-facchini.iam.gserviceaccount.com
          token_format: access_token
      - name: Publicação da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ steps.google.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
          docker push --all-tags "$IMAGEM"

  # Publishes the image to Google Artifact Registry (the VM picks it up within 5 minutes) and
  # to GitHub Packages, ghcr.io, for anyone installing Kaladrius (decision 076).
  # After the docs image, so the VM never starts a stack whose docs image is missing.
  publicar:
    needs: [tests, documentacao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # keyless login to Google Cloud (Workload Identity Federation)
      packages: write  # ghcr.io/facchini-miguel/kaladrius
    env:
      IMAGEM: us-east1-docker.pkg.dev/medical-system-facchini/kaladrius/app
      IMAGEM_PUBLICA: ghcr.io/facchini-miguel/kaladrius
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/16678297522/locations/global/workloadIdentityPools/github/providers/kaladrius
          service_account: github-ci@medical-system-facchini.iam.gserviceaccount.com
          token_format: access_token
      - name: Login no Artifact Registry
        run: echo "${{ steps.google.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
      - name: Login no GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Build e publicação da imagem
        run: |
          VERSAO=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAGS=()
          for destino in "$IMAGEM" "$IMAGEM_PUBLICA"; do
            TAGS+=(-t "$destino:latest" -t "$destino:${GITHUB_SHA::12}")
            # The version tag points to the first image of that version and is never moved.
            if ! docker manifest inspect "$destino:$VERSAO" >/dev/null 2>&1; then
              TAGS+=(-t "$destino:$VERSAO")
            fi
          done
          docker build "${TAGS[@]}" .
          docker push --all-tags "$IMAGEM"
          docker push --all-tags "$IMAGEM_PUBLICA"
