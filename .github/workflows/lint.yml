# Lint on every commit of every branch (decision 137): its own check, next to the CI's, so a branch
# pushed before its pull request is opened is checked too. The CI's tests job runs the same lint again
# before publishing, also on pull requests from forks, whose pushes do not run workflows here (no
# pull_request trigger: it showed a second, skipped "ruff").
#
# The lint is the owner's shared workflow (decision 215): the copy for the public repositories in
# facchini-miguel/facchini.eti.br (its source is facchini-miguel/arauto's, private), pinned to a
# commit. It runs "ruff check --output-format=github ." and "ruff format --check .", with ruff from
# requirements-dev.txt at the lock's version and hashes (decision 136), and checks out without
# credentials (decision 132). The check shows as "Lint / ruff / ruff".
name: Lint

on:
  push:

permissions:
  contents: read

jobs:
  ruff:
    uses: facchini-miguel/facchini.eti.br/.github/workflows/reusable-lint.yml@0fec8e18718cf2f8acb3ef31fb6e775af104132c
    with:
      ruff-from: requirements-dev.txt
