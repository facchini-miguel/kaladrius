# Dependabot (decision 126): pull requests that update dependencies. Security fixes come as
# soon as an advisory is published; version updates come on a schedule, small ones grouped so
# there is one pull request per ecosystem. The CI tests every pull request and deploys only
# what is merged into main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # Development tools first (a dependency goes to the first group it matches): a lint or
      # test-tool change must not hold back the libraries that run in production.
      ferramentas:
        patterns: [ruff, "pytest*"]
        update-types: [minor, patch]
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      documentacao-menores:
        update-types: [minor, patch]

  # Actions are pinned to a commit with the tag in a comment: Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acoes:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /docs]
    schedule:
      interval: monthly
    ignore:
      # A new Python version for the image is a planned change (PR #1, closed): the version
      # set in one place for CI and the image, the tests run on it and the docs updated.
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new PostgreSQL major version needs the data migrated (pg_upgrade or dump and
      # restore): it is done by hand, not by a pull request.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
